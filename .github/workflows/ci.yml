name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-contract-gates:
    name: Code Quality, Invariants & Data Contract Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Gate 1 — Linting (Ruff)
        run: uv run ruff check .

      - name: Gate 2 — Type Checking (Pyright)
        run: uv run pyright

      - name: Gate 3 — Module Size Ceiling (INV-8)
        run: uv run python scripts/check_module_size.py --target-dir src

      - name: Gate 4 — DVC Data Contracts Reproduction (INV-3)
        run: uv run dvc repro

      - name: Gate 5 — Automated Unit Tests (Pytest)
        run: uv run pytest
