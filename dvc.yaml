# DVC Pipeline Architecture for AEGIS (INV-3, ADR-007, ADR-015)
# Policy-data DAG: ingest -> validate_gx -> version -> features -> baseline -> segments
#   -> DGP -> validate_training_gx -> train_estimator -> validate_recovery
#   -> version_artifacts
# Regulatory-corpus path below is a separate 3-stage branch.
#
# `register_candidate` is deliberately NOT a stage: it requires a clean git tree and
# mutates the MLflow registry on every call, so it is a governed Tier 2 manual step
# (`uv run python -m aegis.pipelines.cli register-candidate`), not a cached DVC node.

stages:
  # ==========================================
  # 1. Raw MTPL Policy Data Pipeline Path (Phase 2, Stage 1)
  # ==========================================
  ingest_raw:
    cmd: uv run python -m aegis.pipelines.cli ingest-raw --freq-path data/raw/freMTPLfreq.csv.zip --sev-path data/raw/freMTPLsev.csv --output-path data/raw/raw_policy_data.csv
    deps:
      - data/raw/freMTPLfreq.csv.zip
      - data/raw/freMTPLsev.csv
      - data_contracts/raw_intake_manifest.json
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/raw_intake.py
    outs:
      - data/raw/raw_policy_data.csv

  validate_raw_gx:
    cmd: uv run python -m aegis.pipelines.cli validate-raw --data-path data/raw/raw_policy_data.csv --suite-path data_contracts/raw_policy_suite.json --report-path data/validated/raw_policy_validation_report.json
    deps:
      - data/raw/raw_policy_data.csv
      - data_contracts/raw_policy_suite.json
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/data_contracts.py
      - src/aegis/pipelines/expectations.py
    outs:
      - data/validated/raw_policy_validation_report.json

  version_raw:
    cmd: uv run python -m aegis.pipelines.cli version-raw --raw-path data/raw/raw_policy_data.csv --report-path data/validated/raw_policy_validation_report.json --output-path data/versioned/raw_policy_data.csv
    deps:
      - data/raw/raw_policy_data.csv
      - data/validated/raw_policy_validation_report.json
      - src/aegis/pipelines/cli.py
    outs:
      - data/versioned/raw_policy_data.csv

  build_features:
    cmd: uv run python -m aegis.pipelines.cli build-features --input-path data/versioned/raw_policy_data.csv --glm-output data/processed/features_glm.csv --forest-output data/processed/features_forest.csv --metadata-output data/processed/feature_metadata.json
    deps:
      - data/versioned/raw_policy_data.csv
      - params.yaml
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/feature_pipeline.py
      - src/aegis/config/schema.py
      - src/aegis/schemas/features.py
      - src/aegis/utils/exceptions.py
    outs:
      - data/processed/features_glm.csv
      - data/processed/features_forest.csv
      - data/processed/feature_metadata.json

  glm_baseline:
    cmd: uv run python -m aegis.pipelines.cli build-glm --input-path data/processed/features_glm.csv --fitted-output data/processed/glm_fitted_loss_cost.csv --metadata-output data/processed/glm_baseline_model.json --report-output data/processed/glm_calibration_report.json
    deps:
      - data/processed/features_glm.csv
      - params.yaml
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/glm_baseline.py
      - src/aegis/pipelines/glm_calibration.py
      - src/aegis/config/schema.py
      - src/aegis/schemas/glm.py
      - src/aegis/utils/exceptions.py
    outs:
      - data/processed/glm_fitted_loss_cost.csv
      - data/processed/glm_baseline_model.json
      - data/processed/glm_calibration_report.json

  build_segments:
    cmd: uv run python -m aegis.pipelines.cli build-segments --features-path data/processed/features_glm.csv --fitted-path data/processed/glm_fitted_loss_cost.csv --loss-cost-output data/processed/segment_loss_cost.csv --definitions-output data/processed/segment_definitions.json --policy-segments-output data/processed/policy_segments.csv
    deps:
      - data/processed/features_glm.csv
      - data/processed/glm_fitted_loss_cost.csv
      - params.yaml
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/segments.py
      - src/aegis/config/schema.py
      - src/aegis/schemas/segments.py
      - src/aegis/utils/exceptions.py
    outs:
      - data/processed/segment_loss_cost.csv
      - data/processed/segment_definitions.json
      - data/processed/policy_segments.csv

  generate_dgp:
    cmd: uv run python -m aegis.pipelines.cli generate-dgp
    deps:
      - data/processed/features_forest.csv
      - data/processed/policy_segments.csv
      - data/processed/glm_fitted_loss_cost.csv
      - params.yaml
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/synthetic_dgp.py
      - src/aegis/config/schema.py
      - src/aegis/schemas/dgp.py
      - src/aegis/utils/exceptions.py
    outs:
      - data/processed/elasticity_training.csv
      - data/processed/truth_sidecar.csv
      - data/processed/dgp_manifest.json

  validate_training_gx:
    cmd: uv run python -m aegis.pipelines.cli validate-elasticity --data-path data/processed/elasticity_training.csv --suite-path data_contracts/elasticity_training_suite.json --report-path data/validated/elasticity_training_validation_report.json
    deps:
      - data/processed/elasticity_training.csv
      - data_contracts/elasticity_training_suite.json
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/data_contracts.py
      - src/aegis/pipelines/expectations.py
    outs:
      - data/validated/elasticity_training_validation_report.json

  train_estimator:
    cmd: uv run python -m aegis.pipelines.cli train-estimator
    deps:
      - data/processed/elasticity_training.csv
      # INV-3: the training table's GX gate must complete before training can run.
      - data/validated/elasticity_training_validation_report.json
      - data/processed/segment_definitions.json
      - params.yaml
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/causal_estimator.py
      - src/aegis/pipelines/causal_artifacts.py
      - src/aegis/config/schema.py
      - src/aegis/config/loader.py
      - src/aegis/schemas/causal.py
      - src/aegis/utils/exceptions.py
    outs:
      - data/processed/segment_elasticity_estimates.csv
      - data/processed/causal_estimator_metadata.json
      # The fitted estimator (277 MB) and its run log (wall-clock timings) are
      # non-promotable run artifacts (ADR-014): excluded from `outs` so DVC neither
      # duplicates the binary into the cache nor marks the stage stale every run.

  validate_recovery:
    cmd: uv run python -m aegis.pipelines.cli validate-causal --report-path data/validated/causal_validation_report.json
    deps:
      - data/processed/segment_elasticity_estimates.csv
      - data/processed/elasticity_training.csv
      # INV-3: recovery verification is gated on the training-table contract too.
      - data/validated/elasticity_training_validation_report.json
      - data/processed/truth_sidecar.csv
      - params.yaml
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/causal_estimator.py
      - src/aegis/pipelines/causal_artifacts.py
      - src/aegis/pipelines/validation_harness.py
      - src/aegis/config/schema.py
      - src/aegis/schemas/validation.py
      - src/aegis/utils/exceptions.py
    outs:
      - data/validated/causal_validation_report.json

  version_artifacts:
    cmd: uv run python -m aegis.pipelines.cli version-artifacts --output-path data/versioned/version_manifest.json
    deps:
      - data/versioned/raw_policy_data.csv
      - data/validated/raw_policy_validation_report.json
      - data/processed/features_glm.csv
      - data/processed/features_forest.csv
      - data/processed/feature_metadata.json
      - data/processed/glm_fitted_loss_cost.csv
      - data/processed/glm_baseline_model.json
      - data/processed/glm_calibration_report.json
      - data/processed/segment_loss_cost.csv
      - data/processed/segment_definitions.json
      - data/processed/policy_segments.csv
      - data/processed/elasticity_training.csv
      - data/processed/truth_sidecar.csv
      - data/processed/dgp_manifest.json
      - data/validated/elasticity_training_validation_report.json
      - data/processed/segment_elasticity_estimates.csv
      - data/processed/causal_estimator_metadata.json
      - data/validated/causal_validation_report.json
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/versioning.py
      - src/aegis/schemas/versioning.py
    outs:
      - data/versioned/version_manifest.json

  # ==========================================
  # 2. Regulatory Corpus Data Pipeline Path
  # ==========================================
  ingest_regulatory:
    cmd: uv run python -m aegis.pipelines.cli ingest-regulatory --input-path data_contracts/fixtures/regulatory_valid.json --output-path data/raw/regulatory_raw.json
    deps:
      - data_contracts/fixtures/regulatory_valid.json
      - src/aegis/pipelines/cli.py
    outs:
      - data/raw/regulatory_raw.json

  validate_regulatory_gx:
    cmd: uv run python -m aegis.pipelines.cli validate-regulatory --data-path data/raw/regulatory_raw.json --suite-path data_contracts/regulatory_corpus_suite.json --report-path data/validated/regulatory_validation_report.json
    deps:
      - data/raw/regulatory_raw.json
      - data_contracts/regulatory_corpus_suite.json
      - src/aegis/pipelines/cli.py
      - src/aegis/pipelines/data_contracts.py
    outs:
      - data/validated/regulatory_validation_report.json

  version_regulatory:
    cmd: uv run python -m aegis.pipelines.cli version-regulatory --raw-path data/raw/regulatory_raw.json --report-path data/validated/regulatory_validation_report.json --output-path data/versioned/regulatory_corpus.json
    deps:
      - data/raw/regulatory_raw.json
      - data/validated/regulatory_validation_report.json
      - src/aegis/pipelines/cli.py
    outs:
      - data/versioned/regulatory_corpus.json
