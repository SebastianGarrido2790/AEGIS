# AEGIS Central Configuration Parameters (ADR-005)
# Zero committed secrets; all environment-specific secrets are injected at runtime.

gateway:
  model_name: "gpt-4o-mini"
  fallback_model: "claude-sonnet-4-6"
  temperature: 0.0
  timeout_seconds: 30
  max_retries: 3
  cache_ttl_seconds: 3600

tier1_ml:
  test_size: 0.20
  random_state: 42
  causal_estimator: "CausalForestDML"
  cv_folds: 5
  # Bandit may propose up to ±15%; governance auto-approves only within ±5%,
  # so proposals in (5%, 15%] always escalate by design (drives the escalation-rate KPI).
  exploration_corridor_width: 0.15
  # Deterministic dual-view feature pipeline (P2-F02); edges are left-closed, right-open.
  feature_pipeline:
    exposure_cap: 1.0
    driver_age_bounds: [18, 90]
    car_age_bounds: [0, 34]
    driver_age_band_edges: [18, 25, 45, 65, 100]
    driver_age_band_labels: ["18-24", "25-44", "45-64", "65+"]
    car_age_band_edges: [0, 5, 10, 101]
    car_age_band_labels: ["0-4", "5-9", "10+"]
    density_band_edges: [0, 501, 2001, 1000000000]
    density_band_labels: ["<=500", "501-2000", ">2000"]
    power_levels: ["d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o"]
    brand_levels:
      - "Renault, Nissan or Citroen"
      - "Japanese (except Nissan) or Korean"
      - "Opel, General Motors or Ford"
      - "Volkswagen, Audi, Skoda or Seat"
      - "Mercedes, Chrysler or BMW"
      - "Fiat"
      - "other"
    gas_levels: ["Regular", "Diesel"]
    region_levels:
      - "Centre"
      - "Ile-de-France"
      - "Bretagne"
      - "Pays-de-la-Loire"
      - "Aquitaine"
      - "Nord-Pas-de-Calais"
      - "Poitou-Charentes"
      - "Basse-Normandie"
      - "Haute-Normandie"
      - "Limousin"
  feature_paths:
    glm_view: "data/processed/features_glm.csv"
    forest_view: "data/processed/features_forest.csv"
    metadata: "data/processed/feature_metadata.json"

tier2_agents:
  groundedness_threshold: 0.85
  evidence_coverage_threshold: 0.80
  max_tool_calls: 5
  execution_timeout_seconds: 60
  briefing_timeout_seconds: 2

governance:
  audit_storage_backend: "sqlite"
  audit_db_path: "artifacts/audit_log.db"
  auto_approval_corridor_pct: 0.05
  enforce_hitl_on_flag: true

data_contracts:
  raw_policy_suite_path: "data_contracts/raw_policy_suite.json"
  raw_intake_manifest_path: "data_contracts/raw_intake_manifest.json"
  raw_policy_valid_fixture: "data_contracts/fixtures/raw_policy_valid.csv"
  elasticity_suite_path: "data_contracts/elasticity_training_suite.json"
  regulatory_corpus_suite_path: "data_contracts/regulatory_corpus_suite.json"
  fixtures_dir: "data_contracts/fixtures"
  elasticity_valid_fixture: "data_contracts/fixtures/elasticity_valid.csv"
  elasticity_invalid_leakage_fixture: "data_contracts/fixtures/elasticity_invalid_leakage.csv"
  elasticity_invalid_range_fixture: "data_contracts/fixtures/elasticity_invalid_range.csv"
  regulatory_valid_fixture: "data_contracts/fixtures/regulatory_valid.json"
  regulatory_invalid_missing_meta_fixture: "data_contracts/fixtures/regulatory_invalid_missing_meta.json"
  regulatory_invalid_empty_fixture: "data_contracts/fixtures/regulatory_invalid_empty.json"
  regulatory_invalid_duplicate_fixture: "data_contracts/fixtures/regulatory_invalid_duplicate.json"

dvc:
  remote_name: "local_storage"
  remote_url: ".dvc/local_remote"
