# AEGIS Central Configuration Parameters (ADR-005)
# Zero committed secrets; all environment-specific secrets are injected at runtime.

gateway:
  model_name: "gpt-4o-mini"
  fallback_model: "claude-sonnet-4-6"
  temperature: 0.0
  timeout_seconds: 30
  max_retries: 3
  cache_ttl_seconds: 3600

tier1_ml:
  test_size: 0.20
  random_state: 42
  causal_estimator: "CausalForestDML"
  cv_folds: 5
  # Bandit may propose up to ±15%; governance auto-approves only within ±5%,
  # so proposals in (5%, 15%] always escalate by design (drives the escalation-rate KPI).
  exploration_corridor_width: 0.15
  # Deterministic dual-view feature pipeline (P2-F02); edges are left-closed, right-open.
  feature_pipeline:
    exposure_cap: 1.0
    driver_age_bounds: [18, 90]
    car_age_bounds: [0, 34]
    driver_age_band_edges: [18, 25, 45, 65, 100]
    driver_age_band_labels: ["18-24", "25-44", "45-64", "65+"]
    car_age_band_edges: [0, 5, 10, 101]
    car_age_band_labels: ["0-4", "5-9", "10+"]
    density_band_edges: [0, 501, 2001, 1000000000]
    density_band_labels: ["<=500", "501-2000", ">2000"]
    power_levels: ["d", "e", "f", "g", "h", "i", "j", "k", "l", "m", "n", "o"]
    brand_levels:
      - "Renault, Nissan or Citroen"
      - "Japanese (except Nissan) or Korean"
      - "Opel, General Motors or Ford"
      - "Volkswagen, Audi, Skoda or Seat"
      - "Mercedes, Chrysler or BMW"
      - "Fiat"
      - "other"
    gas_levels: ["Regular", "Diesel"]
    region_levels:
      - "Centre"
      - "Ile-de-France"
      - "Bretagne"
      - "Pays-de-la-Loire"
      - "Aquitaine"
      - "Nord-Pas-de-Calais"
      - "Poitou-Charentes"
      - "Basse-Normandie"
      - "Haute-Normandie"
      - "Limousin"
  feature_paths:
    glm_view: "data/processed/features_glm.csv"
    forest_view: "data/processed/features_forest.csv"
    metadata: "data/processed/feature_metadata.json"
  # Cap-parameterized Tweedie GLM baseline (P2-F03); cap default is a Q1 candidate,
  # final level selected in Stage 5 (Q1). Variance power estimated by profile deviance.
  glm_baseline:
    default_cap: 100000.0
    tweedie_p_min: 1.05
    tweedie_p_max: 1.95
    tweedie_p_step: 0.05
    tweedie_p_refine_step: 0.01
    tweedie_p_fallback: 1.5
    decile_count: 10
    link: "log"
  glm_paths:
    fitted_loss_cost: "data/processed/glm_fitted_loss_cost.csv"
    model_metadata: "data/processed/glm_baseline_model.json"
    calibration_report: "data/processed/glm_calibration_report.json"
  # Tier 1 actuarial segment grid (P2-F05, ADR-014); approved OD-1 merge pools the
  # single sub-1,000-policy cell (18-24 / 5-9 / >2000, 956 policies) into the
  # adjacent density band 501-2000, yielding the combined label ">500".
  segments:
    min_policy_count: 1000
    premium_loading: 0.20
    cell_merges:
      - driver_age_band: "18-24"
        car_age_band: "5-9"
        from_density_band: ">2000"
        to_density_band: "501-2000"
        merged_density_band: ">500"
  segment_paths:
    segment_loss_cost: "data/processed/segment_loss_cost.csv"
    segment_definitions: "data/processed/segment_definitions.json"
    policy_segments: "data/processed/policy_segments.csv"
  # Qualification Q1 loss-cap sweep (P2-D1a). Candidates are the EDA severity
  # percentiles; pass = lowest cap whose transition to the next satisfies both
  # Spearman >= 0.98 and holdout-deviance change <= 1%.
  cap_sweep:
    cap_candidates: [16109.0, 35432.0, 100000.0, 131834.0]
    spearman_threshold: 0.98
    deviance_change_threshold: 0.01
  # Frozen by Q1 (Stage 5): loss cap and uniform excess load.
  loss_cap: 100000.0
  excess_load: 1.1988
  # Semi-synthetic DGP with known ground truth (P2-F04, ADR-013, P2-D2a/b).
  synthetic_dgp:
    random_seed: 42
    corridor_width: 0.15
    confounding_dial: 0.5
    residual_std: 0.05
    overlap_floor_var: 0.001
    estimand_gap_tolerance: 0.02
    dispersion_min_std: 0.010
    homogeneity_max_corr: 0.05
    elasticity_bound_product: 1.0
    a_coeffs:
      base: 1.4
      driver_age_ge_25: 0.3
      car_age_lt_10: 0.2
    b_coeffs:
      base: 3.5
      driver_age_ord: -0.4
      car_age_ord: 0.3
      interaction: -0.1
  dgp_paths:
    training_table: "data/processed/elasticity_training.csv"
    truth_sidecar: "data/processed/truth_sidecar.csv"
    manifest: "data/processed/dgp_manifest.json"
  # Frozen by Q2 (Stage 7, 2026-10-26): full-data GBT fit met the approved budgets.
  estimator:
    training_sample_size: 413169
    nuisance_model: "gbt"
    cv_folds: 5
    runtime_budget_minutes: 30.0
    # P2-F06 Stage 8: effective Q2 forest configuration, made explicit for auditability.
    n_estimators: 100
    min_samples_leaf: 5
    min_samples_split: 10
    max_depth: null
    max_samples: 0.45
    subforest_size: 4
    ci_alpha: 0.05
    q0_floor: 0.000001
    n_jobs: -1
  estimator_paths:
    segment_estimates: "data/processed/segment_elasticity_estimates.csv"
    metadata: "data/processed/causal_estimator_metadata.json"
    model_artifact: "artifacts/causal_estimator/estimator.joblib"
    run_manifest: "artifacts/causal_estimator/run_manifest.json"

tier2_agents:
  grounding_threshold: 0.85
  evidence_coverage_threshold: 0.80
  max_tool_calls: 5
  execution_timeout_seconds: 60
  briefing_timeout_seconds: 2

governance:
  audit_storage_backend: "sqlite"
  audit_db_path: "artifacts/audit_log.db"
  auto_approval_corridor_pct: 0.05
  enforce_hitl_on_flag: true

data_contracts:
  raw_policy_suite_path: "data_contracts/raw_policy_suite.json"
  raw_intake_manifest_path: "data_contracts/raw_intake_manifest.json"
  raw_policy_valid_fixture: "data_contracts/fixtures/raw_policy_valid.csv"
  elasticity_suite_path: "data_contracts/elasticity_training_suite.json"
  regulatory_corpus_suite_path: "data_contracts/regulatory_corpus_suite.json"
  fixtures_dir: "data_contracts/fixtures"
  elasticity_valid_fixture: "data_contracts/fixtures/elasticity_valid.csv"
  elasticity_invalid_leakage_fixture: "data_contracts/fixtures/elasticity_invalid_leakage.csv"
  elasticity_invalid_range_fixture: "data_contracts/fixtures/elasticity_invalid_range.csv"
  regulatory_valid_fixture: "data_contracts/fixtures/regulatory_valid.json"
  regulatory_invalid_missing_meta_fixture: "data_contracts/fixtures/regulatory_invalid_missing_meta.json"
  regulatory_invalid_empty_fixture: "data_contracts/fixtures/regulatory_invalid_empty.json"
  regulatory_invalid_duplicate_fixture: "data_contracts/fixtures/regulatory_invalid_duplicate.json"

dvc:
  remote_name: "local_storage"
  remote_url: ".dvc/local_remote"
